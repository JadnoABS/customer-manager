spring:
  application:
    name: customer-service

  # Contorna um bug conhecido do JDK (detecção de cgroup) que quebra o bean ProcessorMetrics
  # em alguns ambientes (WSL2, certas distros Linux, alguns setups de container).
  # Remova esta exclusão se seu ambiente não apresentar o erro
  # "Cannot invoke jdk.internal.platform.CgroupInfo.getMountPoint()".
  autoconfigure:
    exclude:
      - org.springframework.boot.micrometer.metrics.autoconfigure.system.SystemMetricsAutoConfiguration

  # ---------- H2 / JPA ----------
  datasource:
    url: jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

  # -------------- Credencias de Perfil --------------
  profiles:
    admin:
      password: admin123
    user:
      password: user123

  # Timeouts aplicados ao RestClient.Builder auto-configurado (starter spring-boot-starter-restclient)
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

# ---------- Cliente da API externa ----------
external-api:
  base-url: ${EXTERNAL_API_BASE_URL:https://jsonplaceholder.typicode.com}

# ---------- Actuator / Prometheus ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8080

logging:
  level:
    org.springframework.security: INFO
    com.example.customer: DEBUG